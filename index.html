<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математика для Нины 🌷</title>
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:#FFF7E8;
    background-image:radial-gradient(#F6E3BE 1.6px, transparent 1.6px);
    background-size:26px 26px;
    color:#4A3B2A;
    font-family:'Segoe UI','Trebuchet MS',Verdana,sans-serif;
    font-size:19px;line-height:1.55;
  }
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 70px}
  h1{font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive;font-size:30px;margin:8px 0;color:#D96C47}
  h2{font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive;font-size:23px;color:#D96C47;margin:2px 0 12px}
  .card{
    background:#FFFDF6;border:3px solid #F3E0BC;border-radius:22px;
    padding:18px;margin:14px 0;box-shadow:0 4px 0 #EEDCB6;
  }
  .btn{
    display:inline-block;border:none;cursor:pointer;
    font-family:'Comic Sans MS','Chalkboard SE',cursive;font-size:20px;
    color:#fff;background:#FF8A5C;border-radius:999px;
    padding:13px 26px;margin:6px 8px 6px 0;box-shadow:0 4px 0 #E06B3F;
    transition:transform .08s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #E06B3F}
  .btn.mint{background:#4FBFA0;box-shadow:0 4px 0 #37997E}
  .btn.sky{background:#5AA9E6;box-shadow:0 4px 0 #3C84BE}
  .btn.print{background:#8A5CC9;box-shadow:0 4px 0 #6A3FA8}
  .btn.ghost{background:#fff;color:#D96C47;border:3px solid #F3D9A8;box-shadow:0 4px 0 #EEDCB6;font-size:17px;padding:9px 18px}
  .prob-text{font-size:22px;font-weight:600}
  .parts{display:flex;flex-wrap:wrap;gap:10px}
  .part{border-radius:16px;padding:10px 14px;flex:1 1 210px;border:3px dashed}
  .part b{display:block;font-family:'Comic Sans MS','Chalkboard SE',cursive;font-size:17px;margin-bottom:2px}
  .part.bilo{background:#E8F4FF;border-color:#9CCBF0}
  .part.vzyali{background:#FFEDE6;border-color:#FFB59A}
  .part.ostalos{background:#E7FAF2;border-color:#8FDCBF}
  .part.vopros{background:#F3ECFF;border-color:#C8AEF0}
  .math{
    font-family:'Comic Sans MS','Chalkboard SE',cursive;font-size:32px;font-weight:700;
    color:#2F6DB5;background:#EAF3FF;border-radius:16px;padding:8px 18px;
    display:inline-block;margin:8px 0;letter-spacing:1px;
  }
  .step{border-left:6px solid #FFC94D;padding:8px 14px;margin:14px 0;background:#FFF9EC;border-radius:0 16px 16px 0}
  .step b{font-family:'Comic Sans MS','Chalkboard SE',cursive;color:#B97F1E;font-size:19px}
  input.answer{
    font-size:30px;width:150px;padding:10px;border:3px solid #F3D9A8;border-radius:14px;
    text-align:center;font-family:'Comic Sans MS','Chalkboard SE',cursive;color:#4A3B2A;background:#fff;
  }
  input.answer:focus{outline:3px solid #FFC94D}
  .unit{font-size:20px;margin-left:8px}
  .msg{border-radius:16px;padding:12px 16px;margin:12px 0}
  .msg.ok{background:#E7FAF2;border:3px solid #8FDCBF}
  .msg.hint{background:#FFF3D6;border:3px solid #FFD98A}
  .msg.soft{background:#FFEDE6;border:3px solid #FFB59A}
  .practice{background:#FFF2F8;border-color:#F2B8D0;box-shadow:0 4px 0 #EFCBDD}
  .excard{border:3px dashed #F2B8D0;border-radius:18px;padding:14px;margin:12px 0;background:#fff}
  svg{display:block;max-width:100%;height:auto;margin:6px auto}
  svg text{font-family:'Comic Sans MS','Chalkboard SE',cursive;fill:#4A3B2A}
  .legend{font-size:16px;color:#8a7358;text-align:center;margin:6px 0 0}
  .menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:12px;margin:8px 0}
  .pbtn{
    position:relative;aspect-ratio:1;font-family:'Comic Sans MS','Chalkboard SE',cursive;
    font-size:26px;border-radius:20px;border:3px solid #F3D9A8;background:#fff;
    cursor:pointer;box-shadow:0 3px 0 #EEDCB6;color:#4A3B2A;
  }
  .pbtn:hover{background:#FFF3D6}
  .pbtn .star{position:absolute;top:-10px;right:-10px;font-size:22px}
  .pbtn .medal{position:absolute;bottom:-10px;right:-10px;font-size:20px}
  .howto ol{margin:6px 0;padding-left:24px}
  .howto li{margin:6px 0}
  .two{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .two>div{flex:1 1 280px}
  /* --- рабочий лист для печати --- */
  #printArea{display:none}
  .ws-line{border-bottom:2px dotted #A79E8C;height:36px;margin:6px 0}
  .ws-answer{display:inline-block;min-width:130px;border-bottom:2px dotted #A79E8C}
  @media print{
    body{background:#fff;background-image:none;font-size:15px}
    #app{display:none!important}
    #printArea{display:block!important;color:#000}
    #printArea .card{border:2px solid #999;box-shadow:none;border-radius:12px}
    #printArea h1{font-size:24px;color:#000}
    #printArea h2{font-size:19px;color:#000}
  }
  @media(max-width:520px){
    .math{font-size:25px}
    .prob-text{font-size:20px}
    h1{font-size:26px}
    body{font-size:18px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script>
/* ============================================================
   Математика для Нины — 10 текстовых задач с картинками,
   печатью рабочего листа и генератором похожих упражнений
   ============================================================ */

/* ---------- Маленькие рисунки (SVG), каждый в клетке 64x64 ---------- */
function iBucket(x,y){return '<g transform="translate('+x+','+y+')">'+
  '<path d="M12 22 L52 22 L47 58 L17 58 Z" fill="#8FD3F4" stroke="#3E7CA6" stroke-width="3" stroke-linejoin="round"/>'+
  '<path d="M17 22 Q32 0 47 22" fill="none" stroke="#8A6D4B" stroke-width="4" stroke-linecap="round"/>'+
  '<path d="M15 33 L49 33" stroke="#C9EAFB" stroke-width="4" stroke-linecap="round"/></g>';}

function iSun(x,y){
  var rays='';
  for(var i=0;i<8;i++){var a=i*Math.PI/4;
    rays+='<line x1="'+(32+Math.cos(a)*20).toFixed(1)+'" y1="'+(32+Math.sin(a)*20).toFixed(1)+
          '" x2="'+(32+Math.cos(a)*27).toFixed(1)+'" y2="'+(32+Math.sin(a)*27).toFixed(1)+'"/>';}
  return '<g transform="translate('+x+','+y+')">'+
    '<g stroke="#F2A93B" stroke-width="3" stroke-linecap="round">'+rays+'</g>'+
    '<circle cx="32" cy="32" r="15" fill="#FFD45E" stroke="#F2A93B" stroke-width="3"/>'+
    '<circle cx="27" cy="29" r="2" fill="#B97F1E"/><circle cx="37" cy="29" r="2" fill="#B97F1E"/>'+
    '<path d="M27 36 Q32 40 37 36" stroke="#B97F1E" stroke-width="2" fill="none" stroke-linecap="round"/></g>';
}

function iMushroom(x,y){return '<g transform="translate('+x+','+y+')">'+
  '<path d="M26 34 h12 l3 22 q-9 4 -18 0 z" fill="#FFF1DC" stroke="#C9A176" stroke-width="3" stroke-linejoin="round"/>'+
  '<path d="M8 34 Q10 8 32 8 Q54 8 56 34 Q32 43 8 34 Z" fill="#E2725B" stroke="#B04A36" stroke-width="3"/>'+
  '<circle cx="22" cy="21" r="3.4" fill="#FFF"/><circle cx="38" cy="16" r="3" fill="#FFF"/><circle cx="45" cy="27" r="2.6" fill="#FFF"/></g>';}

function iPeach(x,y){return '<g transform="translate('+x+','+y+')">'+
  '<path d="M32 14 Q54 12 54 36 Q54 56 32 58 Q10 56 10 36 Q10 12 32 14 Z" fill="#FFB26B" stroke="#E08543" stroke-width="3"/>'+
  '<path d="M32 15 Q29 36 32 57" stroke="#E08543" stroke-width="2.5" fill="none" opacity=".6"/>'+
  '<path d="M34 13 Q45 2 53 9 Q45 17 34 13 Z" fill="#7FBF6E" stroke="#5C9A4D" stroke-width="2.5"/></g>';}

function iKiwi(x,y){return '<g transform="translate('+x+','+y+')">'+
  '<ellipse cx="32" cy="36" rx="22" ry="18" fill="#9C6B3C" stroke="#7A5228" stroke-width="3"/>'+
  '<ellipse cx="32" cy="36" rx="14" ry="10" fill="#A8C256"/>'+
  '<ellipse cx="32" cy="36" rx="5" ry="3.6" fill="#E9F1C2"/>'+
  '<circle cx="24" cy="32" r="1.4" fill="#4A3B2A"/><circle cx="40" cy="32" r="1.4" fill="#4A3B2A"/>'+
  '<circle cx="24" cy="40" r="1.4" fill="#4A3B2A"/><circle cx="40" cy="40" r="1.4" fill="#4A3B2A"/></g>';}

function iBarrel(x,y){return '<g transform="translate('+x+','+y+')">'+
  '<path d="M14 10 Q32 4 50 10 Q58 32 50 54 Q32 60 14 54 Q6 32 14 10 Z" fill="#C98B4E" stroke="#8F5B24" stroke-width="3"/>'+
  '<path d="M10 22 Q32 29 54 22" fill="none" stroke="#8F5B24" stroke-width="3"/>'+
  '<path d="M10 42 Q32 49 54 42" fill="none" stroke="#8F5B24" stroke-width="3"/>'+
  '<ellipse cx="32" cy="9" rx="18" ry="5" fill="#E0A866" stroke="#8F5B24" stroke-width="3"/></g>';}

function iPumpkin(x,y){return '<g transform="translate('+x+','+y+')">'+
  '<ellipse cx="32" cy="38" rx="26" ry="20" fill="#FF9F43" stroke="#D97A1F" stroke-width="3"/>'+
  '<path d="M32 18 Q23 38 32 58 M32 18 Q41 38 32 58" stroke="#D97A1F" stroke-width="2.5" fill="none" opacity=".7"/>'+
  '<path d="M32 18 Q15 26 14 40 M32 18 Q49 26 50 40" stroke="#D97A1F" stroke-width="2" fill="none" opacity=".45"/>'+
  '<path d="M32 19 Q30 8 39 8" stroke="#5C8A3A" stroke-width="5" fill="none" stroke-linecap="round"/></g>';}

function iHeart(x,y){return '<g transform="translate('+x+','+y+')">'+
  '<path d="M32 54 Q6 34 10 18 Q13 8 24 10 Q30 12 32 18 Q34 12 40 10 Q51 8 54 18 Q58 34 32 54 Z" '+
  'fill="#FF7B9C" stroke="#E04A73" stroke-width="3"/></g>';}

function iHeartGold(x,y){return '<g transform="translate('+x+','+y+')">'+
  '<path d="M32 54 Q6 34 10 18 Q13 8 24 10 Q30 12 32 18 Q34 12 40 10 Q51 8 54 18 Q58 34 32 54 Z" '+
  'fill="#FFD45E" stroke="#F2A93B" stroke-width="3"/></g>';}

function iGirl(x,y,dress){return '<g transform="translate('+x+','+y+')">'+
  '<path d="M15 18 Q30 -8 45 18 L45 26 Q30 18 15 26 Z" fill="#7A4A21"/>'+
  '<circle cx="30" cy="20" r="13" fill="#FFD9B8" stroke="#E0A878" stroke-width="2.5"/>'+
  '<circle cx="25" cy="18" r="1.8" fill="#4A3B2A"/><circle cx="35" cy="18" r="1.8" fill="#4A3B2A"/>'+
  '<path d="M25 25 Q30 29 35 25" stroke="#C97B4A" stroke-width="2" fill="none" stroke-linecap="round"/>'+
  '<path d="M30 34 L13 64 L47 64 Z" fill="'+dress+'" stroke="#00000022" stroke-width="2" stroke-linejoin="round"/></g>';}

var ITEMS={bucket:iBucket,sun:iSun,mushroom:iMushroom,peach:iPeach,kiwi:iKiwi,barrel:iBarrel,pumpkin:iPumpkin,heart:iHeart};

function cross(x,y){
  return '<g stroke="#E4572E" stroke-width="5" stroke-linecap="round">'+
  '<line x1="'+(x+13)+'" y1="'+(y+18)+'" x2="'+(x+51)+'" y2="'+(y+56)+'"/>'+
  '<line x1="'+(x+51)+'" y1="'+(y+18)+'" x2="'+(x+13)+'" y2="'+(y+56)+'"/></g>';
}

/* Сетка одинаковых предметов. list: [{type, removed}] */
function gridSVG(list, opts){
  opts=opts||{};
  var cell=opts.cell||72;
  var perRow=opts.perRow||Math.min(list.length,7);
  var rows=Math.ceil(list.length/perRow);
  var top=opts.label?34:0;
  var w=perRow*cell, h=rows*cell+top;
  var s='';
  if(opts.label) s+='<text x="6" y="24" font-size="19" font-weight="700" fill="#B97F1E">'+opts.label+'</text>';
  list.forEach(function(it,i){
    var r=Math.floor(i/perRow), c=i%perRow;
    var x=c*cell+4, y=top+r*cell+4;
    s+= it.removed ? ('<g opacity=".32">'+ITEMS[it.type](x,y)+'</g>'+cross(x,y)) : ITEMS[it.type](x,y);
  });
  return {s:s,w:w,h:h};
}

function svgWrap(inner,w,h){
  return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" role="img">'+inner+'</svg>';
}

function gridImg(list,opts){var g=gridSVG(list,opts);return svgWrap(g.s,g.w,g.h);}

function makeList(type,n,rem){
  var a=[];
  for(var i=0;i<n;i++) a.push({type:type,removed:i<(rem||0)});
  return a;
}

/* ---------- Универсальные картинки для упражнений ---------- */

/* Два предмета: маленький и большой (бочонки, тыквы) */
function drawPair(type, small, smallSub, big, bigSub, caption){
  var s='';
  s+='<g transform="translate(80,30) scale(1.4)">'+ITEMS[type](0,0)+'</g>';
  s+='<text x="125" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#2F6DB5">'+small+'</text>';
  s+='<text x="125" y="176" text-anchor="middle" font-size="16">'+smallSub+'</text>';
  s+='<g transform="translate(300,10) scale(2.0)">'+ITEMS[type](0,0)+'</g>';
  s+='<text x="364" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#D96C47">'+big+'</text>';
  s+='<text x="364" y="176" text-anchor="middle" font-size="16">'+bigSub+'</text>';
  s+='<text x="245" y="212" text-anchor="middle" font-size="17" fill="#8a7358">'+caption+'</text>';
  return svgWrap(s,490,230);
}

/* Числовая линейка: предыдущее число + прыжок (ответ скрыт за звёздочкой) */
function drawNumLineN(N,jump){
  var prev=N-1, ans=prev+jump;
  var start=prev-2, end=ans+1, span=end-start;
  var unit=Math.min(48, Math.floor(560/span));
  var x0=44, y=118, W=x0*2+span*unit;
  function X(n){return x0+(n-start)*unit;}
  var s='<line x1="'+(x0-22)+'" y1="'+y+'" x2="'+(X(end)+22)+'" y2="'+y+'" stroke="#8A6D4B" stroke-width="4" stroke-linecap="round"/>';
  for(var n=start;n<=end;n++){
    s+='<line x1="'+X(n)+'" y1="'+(y-8)+'" x2="'+X(n)+'" y2="'+(y+8)+'" stroke="#8A6D4B" stroke-width="3"/>'+
       '<text x="'+X(n)+'" y="'+(y+32)+'" text-anchor="middle" font-size="15">'+n+'</text>';
  }
  /* N — пунктирный кружок (исходное число) */
  s+='<circle cx="'+X(N)+'" cy="'+(y-28)+'" r="15" fill="#FFF" stroke="#B8AE9E" stroke-width="3" stroke-dasharray="4 3"/>'+
     '<text x="'+X(N)+'" y="'+(y-23)+'" text-anchor="middle" font-size="14" fill="#8a7358">'+N+'</text>';
  /* prev — золотой (предыдущее) */
  s+='<circle cx="'+X(prev)+'" cy="'+(y-28)+'" r="15" fill="#FFD45E" stroke="#F2A93B" stroke-width="3"/>'+
     '<text x="'+X(prev)+'" y="'+(y-23)+'" text-anchor="middle" font-size="14" font-weight="700">'+prev+'</text>';
  /* дуга +jump к звёздочке-вопросу */
  var xa=X(prev)+15, xb=X(ans)-15, xm=(xa+xb)/2;
  s+='<path d="M '+xa+' '+(y-38)+' Q '+xm+' '+(y-108)+' '+xb+' '+(y-38)+'" fill="none" stroke="#4FBFA0" stroke-width="4" stroke-linecap="round"/>'+
     '<path d="M '+(xb+2)+' '+(y-50)+' L '+(xb+10)+' '+(y-36)+' L '+(xb-6)+' '+(y-36)+' Z" fill="#4FBFA0"/>'+
     '<text x="'+xm+'" y="'+(y-96)+'" text-anchor="middle" font-size="19" font-weight="700" fill="#37997E">+'+jump+'</text>';
  s+='<circle cx="'+X(ans)+'" cy="'+(y-28)+'" r="16" fill="#FFF2F8" stroke="#E04A73" stroke-width="3"/>'+
     '<text x="'+X(ans)+'" y="'+(y-21)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#E04A73">?</text>';
  return svgWrap(s,W,200);
}

/* Кубики: a жёлтых + b зелёных + серые «?» */
function drawBlocksN(total,a,b){
  var perRow=15, cell= total>30?30:40, size=cell-8;
  var rows=Math.ceil(total/perRow), s='';
  for(var i=0;i<total;i++){
    var r=Math.floor(i/perRow), c=i%perRow, x=c*cell+4, y=r*cell+6, color, stroke;
    if(i<a){color='#FFC94D';stroke='#E0A42E';}
    else if(i<a+b){color='#8FDCBF';stroke='#57B894';}
    else{color='#EFEAE0';stroke='#C9C2B2';}
    s+='<rect x="'+x+'" y="'+y+'" width="'+size+'" height="'+size+'" rx="6" fill="'+color+'" stroke="'+stroke+'" stroke-width="2.5"/>';
    if(i>=a+b) s+='<text x="'+(x+size/2)+'" y="'+(y+size-8)+'" text-anchor="middle" font-size="13" fill="#A79E8C">?</text>';
  }
  s+='<text x="4" y="'+(rows*cell+28)+'" font-size="15" fill="#8a7358">Всего '+total+' кубиков: '+a+' жёлтых и '+b+' зелёных — это сумма. Серые — столько нужно убрать.</text>';
  return svgWrap(s, perRow*cell+8, rows*cell+40);
}

/* Две девочки с сердечками-годиками: у старшей d золотых «лишних» */
function drawHeartsN(n1,d,name1,name2,total){
  var s='';
  s+=iGirl(70,10,'#7EC8E3');
  s+='<text x="100" y="100" text-anchor="middle" font-size="19" font-weight="700" fill="#2F6DB5">'+name1+' — ?</text>';
  var g1=gridSVG(makeList('heart',n1,0),{perRow:7,cell:44});
  s+='<g transform="translate(10,110)">'+g1.s+'</g>';
  s+=iGirl(370,10,'#C3A6FF');
  s+='<text x="400" y="100" text-anchor="middle" font-size="19" font-weight="700" fill="#8A5CC9">'+name2+' = '+name1+' + '+d+'</text>';
  var g2=gridSVG(makeList('heart',n1,0),{perRow:7,cell:44});
  s+='<g transform="translate(310,110)">'+g2.s+'</g>';
  var g3=gridSVG(makeList('heart',d,0),{perRow:7,cell:44});
  var baseX=310+(n1%7)*44, baseY=110+Math.floor(n1/7)*44;
  s+='<g transform="translate('+baseX+','+baseY+')">'+g3.s.replace(/#FF7B9C/g,'#FFD45E').replace(/#E04A73/g,'#F2A93B')+'</g>';
  s+='<text x="310" y="205" text-anchor="middle" font-size="17" fill="#8a7358">Сердечки — годики. Вместе у девочек '+total+' годиков. Золотые — «лишние» годики '+name2+'.</text>';
  return svgWrap(s,620,215);
}

/* ---------- Особые картинки для основных задач ---------- */

/* Задача 2: Винни-Пух, Кролик и Пятачок ждут поезд + часы */
function drawP2(){
  var s='';
  s+='<g transform="translate(60,46)">'+
     '<circle cx="14" cy="14" r="10" fill="#B07D4F" stroke="#8A5A2E" stroke-width="3"/>'+
     '<circle cx="58" cy="14" r="10" fill="#B07D4F" stroke="#8A5A2E" stroke-width="3"/>'+
     '<circle cx="36" cy="36" r="26" fill="#B07D4F" stroke="#8A5A2E" stroke-width="3"/>'+
     '<ellipse cx="36" cy="44" rx="11" ry="8" fill="#E8C9A0"/>'+
     '<circle cx="36" cy="40" r="3" fill="#4A3B2A"/>'+
     '<circle cx="27" cy="31" r="2.4" fill="#4A3B2A"/><circle cx="45" cy="31" r="2.4" fill="#4A3B2A"/></g>';
  s+='<text x="96" y="140" text-anchor="middle" font-size="16">Винни-Пух</text>';
  s+='<g transform="translate(200,30)">'+
     '<ellipse cx="24" cy="6" rx="7" ry="20" fill="#F5F0E8" stroke="#B8AE9E" stroke-width="3"/>'+
     '<ellipse cx="48" cy="6" rx="7" ry="20" fill="#F5F0E8" stroke="#B8AE9E" stroke-width="3"/>'+
     '<ellipse cx="24" cy="8" rx="3" ry="12" fill="#F8C8D4"/>'+
     '<ellipse cx="48" cy="8" rx="3" ry="12" fill="#F8C8D4"/>'+
     '<circle cx="36" cy="52" r="25" fill="#F5F0E8" stroke="#B8AE9E" stroke-width="3"/>'+
     '<circle cx="28" cy="48" r="2.4" fill="#4A3B2A"/><circle cx="44" cy="48" r="2.4" fill="#4A3B2A"/>'+
     '<path d="M32 56 Q36 60 40 56" stroke="#8a7358" stroke-width="2" fill="none" stroke-linecap="round"/>'+
     '<ellipse cx="36" cy="54" rx="3.4" ry="2.6" fill="#F8A8BC"/></g>';
  s+='<text x="236" y="140" text-anchor="middle" font-size="16">Кролик</text>';

/* Задача 8: 30 кубиков */
function drawP8(){
  var s='', cell=40, size=32;
  for(var i=0;i<30;i++){
    var r=Math.floor(i/15), c=i%15;
    var x=c*cell+4, y=r*46+8;
    var color, stroke;
    if(i<13){color='#FFC94D';stroke='#E0A42E';}
    else if(i<21){color='#8FDCBF';stroke='#57B894';}
    else {color='#EFEAE0';stroke='#C9C2B2';}
    s+='<rect x="'+x+'" y="'+y+'" width="'+size+'" height="'+size+'" rx="8" fill="'+color+'" stroke="'+stroke+'" stroke-width="3"/>';
    if(i>=21) s+='<text x="'+(x+size/2)+'" y="'+(y+22)+'" text-anchor="middle" font-size="16" fill="#A79E8C">?</text>';
  }
  s+='<text x="4" y="128" font-size="16" fill="#8a7358">13 жёлтых + 8 зелёных = 21, а серых — столько, сколько нужно убрать</text>';
  return svgWrap(s,600,140);
}

/* ---------- Генератор похожих упражнений (новые числа, та же логика) ---------- */
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function plural(n,one,few,many){var m=n%10,h=n%100;if(m===1&&h!==11)return one;if(m>=2&&m<=4&&(h<12||h>14))return few;return many;}
var GIRLS=['Оля','Маша','Катя','Лена','Даша','Соня'];
var BOYS=['Миша','Коля','Петя','Вася','Толя','Саша'];
function twoGirls(){var a=pick(GIRLS),b=pick(GIRLS);while(b===a)b=pick(GIRLS);return[a,b];}

/* ---------- Логика сайта ---------- */
var app=document.getElementById('app');
var stars=[], trained=[];
try{stars=JSON.parse(localStorage.getItem('ninaMathStars')||'[]');}catch(e){stars=[];}
try{trained=JSON.parse(localStorage.getItem('ninaMathTrained')||'[]');}catch(e){trained=[];}
var cur=null, shownSteps=0, tries=0, exIdx=0, exTries=0;

var PRAISES=[
  'Ты настоящий математик! 🌟',
  'У тебя отлично получается рассуждать! 🎨',
  'Так держать, умница! 💪',
  'Ты разобрала задачу как настоящий учёный! 🚀'
];
function praise(){return PRAISES[Math.floor(Math.random()*PRAISES.length)];}
function save(){try{localStorage.setItem('ninaMathStars',JSON.stringify(stars));localStorage.setItem('ninaMathTrained',JSON.stringify(trained));}catch(e){}}

function home(){
  cur=null;
  var btns=PROBLEMS.map(function(p){
    return '<button class="pbtn" onclick="openP('+p.id+')">'+p.id+
      (stars.indexOf(p.id)>=0?'<span class="star">⭐</span>':'')+
      (trained.indexOf(p.id)>=0?'<span class="medal">🏅</span>':'')+'</button>';
  }).join('');
  app.innerHTML='<div class="wrap">'+
    '<h1>🌷 Математика для Нины</h1>'+
    '<div class="card"><p>Привет, Нина! Здесь мы учимся решать задачи как художники: '+
    '<b>читаем, рисуем и рассуждаем по шагам</b>. Выбери любую задачу:</p>'+
    '<p>⭐ — задача решена &nbsp;·&nbsp; 🏅 — тренировка пройдена</p></div>'+
    '<div class="menu">'+btns+'</div>'+
    '<div class="card howto"><h2>🎨 Главный секрет решения задач</h2><ol>'+
    '<li>Прочитай задачу <b>два раза</b>, не торопись.</li>'+
    '<li>Найди, что дано: что <b>было</b>, что <b>взяли</b> или <b>добавили</b>, что <b>осталось</b>.</li>'+
    '<li><b>Нарисуй</b> картинку — предметы или кружочки. Рисунок всегда подсказывает!</li>'+
    '<li>Решай <b>маленькими шагами</b> и в конце проверь себя.</li>'+
    '</ol></div>'+
  '</div>';
  window.scrollTo(0,0);
}

function openP(id){
  cur=PROBLEMS.filter(function(p){return p.id===id;})[0];
  shownSteps=0; tries=0;
  /* генерируем 3 похожих упражнения с разными текстами */
  cur.exercises=[];
  var guard=0;
  while(cur.exercises.length<3 && guard<40){
    guard++;
    var e=GEN[id]();
    if(!cur.exercises.some(function(x){return x.text===e.text;})) cur.exercises.push(e);
  }
  var parts=cur.parts.map(function(pt){
    return '<div class="part '+pt.c+'"><b>'+pt.l+'</b>'+pt.t+'</div>';
  }).join('');
  app.innerHTML='<div class="wrap">'+
    '<button class="btn ghost" onclick="home()">← Все задачи</button>'+
    '<button class="btn print" onclick="window.print()">🖨️ Распечатать задание</button>'+
    '<h1>Задача '+cur.id+'</h1>'+
    '<div class="card"><p class="prob-text">'+cur.text+'</p></div>'+
    '<div class="card"><h2>🧩 Разберём по частям</h2><div class="parts">'+parts+'</div></div>'+
    '<div class="card"><h2>🖍️ Картинка-подсказка</h2>'+cur.draw()+
      '<p class="legend">'+cur.legend+'</p>'+
      '<p class="legend">✏️ <b>'+cur.drawPrompt+'</b></p></div>'+
    '<div class="card"><h2>💪 Попробовать самой</h2>'+
      '<div id="answerZone">'+
        '<p>Впиши ответ, Нина, и нажми «Проверить»:</p>'+
        '<input class="answer" id="ans" type="number" inputmode="numeric" placeholder="?">'+
        (cur.unit?'<span class="unit">'+cur.unit+'</span>':'')+
        '<br><button class="btn mint" onclick="checkAnswer()">Проверить ✔</button>'+
      '</div>'+
      '<div id="feedback"></div>'+
    '</div>'+
    '<div class="card"><h2>👣 Решение по шагам</h2>'+
      '<p>Если трудно — подсмотри решение. Шаги открываются по одному:</p>'+
      '<div id="steps"></div>'+
      '<button class="btn sky" id="stepBtn" onclick="nextStep()">Показать шаг 1</button>'+
    '</div>'+
    '<div id="practiceZone"></div>'+
  '</div>';
  buildPrint();
  window.scrollTo(0,0);
}

function nextStep(){
  if(!cur||shownSteps>=cur.steps.length) return;
  var s=cur.steps[shownSteps]; shownSteps++;
  document.getElementById('steps').insertAdjacentHTML('beforeend',
    '<div class="step"><b>'+s.t+'</b>'+
    (s.m?'<div class="math">'+s.m+'</div>':'')+
    '<div>'+s.e+'</div></div>');
  var btn=document.getElementById('stepBtn');
  if(shownSteps<cur.steps.length){
    btn.textContent='Показать шаг '+(shownSteps+1);
  }else{
    btn.style.display='none';
    document.getElementById('steps').insertAdjacentHTML('beforeend',
      '<div class="step" style="border-color:#8FDCBF;background:#F0FCF6"><b>✅ Ответ:</b> '+
      '<span class="math" style="background:#E7FAF2;color:#2E8B6E">'+cur.answer+(cur.unit?' '+cur.unit:'')+'</span></div>');
    showPracticeIntro();
  }
}

function showPracticeIntro(){
  var zone=document.getElementById('practiceZone');
  if(!zone||zone.innerHTML) return;
  zone.innerHTML='<div class="card practice"><h2>🌟 А теперь проверим, как ты поняла!</h2>'+
    '<p>Вот <b>3 такие же задачи с новыми числами</b>. Решай сама: нарисуй картинку в тетради — она подскажет ответ. '+
    'За все три получишь медаль 🏅!</p>'+
    '<button class="btn mint" onclick="startPractice()">Начать тренировку 💪</button>'+
    '<button class="btn print" onclick="window.print()">🖨️ Распечатать лист с задачами</button></div>';
  zone.scrollIntoView({behavior:'smooth',block:'center'});
}

function startPractice(){exIdx=0; showEx();}

function showEx(){
  exTries=0;
  var e=cur.exercises[exIdx];
  var zone=document.getElementById('practiceZone');
  zone.innerHTML='<div class="card practice"><h2>🌟 Упражнение '+(exIdx+1)+' из '+cur.exercises.length+'</h2>'+
    '<div class="excard">'+
      '<p class="prob-text">'+e.text+'</p>'+
      e.draw()+
      '<p style="margin-top:12px">Впиши ответ: '+
      '<input class="answer" id="exans" type="number" inputmode="numeric" placeholder="?">'+
      (e.unit?' <span class="unit">'+e.unit+'</span>':'')+'</p>'+
      '<button class="btn mint" onclick="checkEx()">Проверить ✔</button>'+
      '<div id="exfb"></div>'+
    '</div></div>';
  zone.scrollIntoView({behavior:'smooth',block:'center'});
}

function finishTraining(){
  if(trained.indexOf(cur.id)<0){trained.push(cur.id); save();}
  document.getElementById('practiceZone').innerHTML=
    '<div class="card practice"><h2>🏆 Ура, Нина!</h2>'+
    '<p>Ты решила всю тренировку! Теперь ты точно умеешь решать такие задачи. '+
    'Нарисуй себе в тетради большую медаль! 🏅</p>'+
    '<button class="btn" onclick="home()">← Ко всем задачам</button></div>';
}

function exStepsHTML(e){
  return e.steps.map(function(s){
    return '<div class="step"><b>'+s.t+'</b>'+(s.m?'<div class="math">'+s.m+'</div>':'')+'<div>'+s.e+'</div></div>';
  }).join('')+
  '<div class="step" style="border-color:#8FDCBF;background:#F0FCF6"><b>✅ Ответ:</b> '+
  '<span class="math" style="background:#E7FAF2;color:#2E8B6E">'+e.answer+(e.unit?' '+e.unit:'')+'</span></div>';
}

function checkEx(){
  var e=cur.exercises[exIdx];
  var inp=document.getElementById('exans');
  var v=(inp.value||'').toString().trim();
  var fb=document.getElementById('exfb');
  if(v===''){fb.innerHTML='<div class="msg hint">Сначала напиши число 🙂</div>';return;}
  if(Number(v)===e.answer){
    exIdx++;
    if(exIdx>=cur.exercises.length){finishTraining();}
    else{
      fb.innerHTML='<div class="msg ok">🎉 Верно! '+praise()+'</div>'+
        '<button class="btn" onclick="showEx()">Следующее упражнение →</button>';
    }
  }else{
    exTries++;
    if(exTries===1){
      fb.innerHTML='<div class="msg hint">🤔 Почти! Намёк: <b>'+e.hint+'</b><br>Посмотри на картинку и попробуй ещё раз.</div>';
      inp.value=''; inp.focus();
    }else{
      fb.innerHTML='<div class="msg soft">💛 Ничего страшного! Смотри, как это решается:</div>'+
        exStepsHTML(e)+
        '<button class="btn" onclick="nextAfterFail()">'+(exIdx+1<cur.exercises.length?'Следующее упражнение →':'Закончить')+'</button>';
    }
  }
}

function nextAfterFail(){
  exIdx++;
  if(exIdx>=cur.exercises.length){finishTraining();}else{showEx();}
}

/* ---------- Проверка основной задачи ---------- */
function checkAnswer(){
  var inp=document.getElementById('ans');
  var v=(inp.value||'').toString().trim();
  var fb=document.getElementById('feedback');
  if(v===''){fb.innerHTML='<div class="msg hint">Сначала напиши число в окошко 🙂</div>';return;}
  if(Number(v)===cur.answer){
    if(stars.indexOf(cur.id)<0){stars.push(cur.id); save();}
    document.getElementById('answerZone').style.display='none';
    fb.innerHTML='<div class="msg ok">🎉 <b>Молодец, Нина!</b> '+praise()+'<br>'+cur.explain+'</div>';
    while(shownSteps<cur.steps.length) nextStep();
  }else{
    tries++;
    if(tries===1){
      fb.innerHTML='<div class="msg hint">🤔 Почти получилось! Намёк: <b>'+cur.hint+'</b><br>Попробуй ещё раз — у тебя выйдет!</div>';
      inp.value=''; inp.focus();
    }else{
      fb.innerHTML='<div class="msg soft">💛 Ничего страшного — ошибаться не страшно, так учатся! Давай посмотрим решение вместе, шаг за шагом:</div>';
      document.getElementById('answerZone').style.display='none';
      while(shownSteps<cur.steps.length) nextStep();
    }
  }
}

/* ---------- Рабочий лист для печати ---------- */
function wsCard(num,text,drawHTML,lines){
  var ls='';
  for(var i=0;i<lines;i++) ls+='<div class="ws-line"></div>';
  return '<div class="card"><p><b>Задача '+num+'.</b> '+text+'</p>'+drawHTML+
    '<p><b>Решение:</b></p>'+ls+
    '<p><b>Ответ:</b> <span class="ws-answer"></span></p></div>';
}

function buildPrint(){
  var p=cur;
  var html='<h1>🌷 Математика — рабочий лист Нины</h1>'+
    '<p>Реши каждую задачу по шагам: сначала рассмотри картинку, потом запиши решение. '+
    'Если трудно — нарисуй свою картинку рядом! ✏️</p>';
  html+=wsCard(1,p.text,p.draw(),4);
  p.exercises.forEach(function(e,i){
    html+=wsCard(i+2,e.text,e.draw(),3);
  });
  html+='<p style="text-align:center;margin-top:18px">Молодец, Нина! Каждая решённая задача — это победа! 🏅</p>';
  document.getElementById('printArea').innerHTML=html;
}

home();
</script>
</script>
